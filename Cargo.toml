[package]
name = "logquery"
version = "0.1.0"
edition = "2021"
description = "Run SQL-like queries over JSON Lines and logfmt log files"
license = "MIT"
readme = "README.md"
repository = "https://github.com/roxiproject/logquery"
keywords = ["logs", "sql", "json", "logfmt", "cli"]
categories = ["command-line-utilities"]

[dependencies]
# Parsing JSON Lines records. Writing a correct JSON parser is not the point of
# this project, and serde_json is the de-facto standard.
# `preserve_order` keeps record fields in the order the log emitter wrote them,
# which is what `select *` should print.
serde_json = { version = "1", features = ["preserve_order"] }
# Error context propagation for the I/O layer.
anyhow = "1"

[profile.release]
lto = true
strip = true
